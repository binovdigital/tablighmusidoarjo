<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kajian - Majelis Tabligh PDM Sidoarjo</title>
    
    <!-- Impor Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Tema ala Shadcn/ui -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        border: "hsl(214.3, 31.8%, 91.4%)",
                        background: "hsl(0, 0%, 100%)",
                        foreground: "hsl(222.2, 47.4%, 11.2%)",
                        primary: "hsl(222.2, 47.4%, 11.2%)",
                        "primary-foreground": "hsl(210, 40%, 98%)",
                        muted: "hsl(210, 40%, 96.1%)",
                        "muted-foreground": "hsl(215.4, 16.3%, 46.9%)",
                    },
                    borderRadius: {
                        xl: "0.75rem",
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased min-h-screen flex flex-col bg-background text-foreground font-sans">

    <!-- Navigasi -->
    <header class="sticky top-0 z-50 w-full border-b border-border bg-white/95 backdrop-blur">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="https://picsum.photos/seed/logo/40/40" alt="Logo" class="rounded-full w-10 h-10 object-cover">
                <span class="font-bold text-lg tracking-tight">Tablighmu Sidoarjo</span>
            </a>
            <nav class="hidden md:flex gap-6 text-sm font-medium">
                <a href="index.html" class="text-muted-foreground hover:text-foreground transition-colors">Beranda</a>
                <!-- Link aktif diberi warna foreground (lebih gelap) -->
                <a href="kajian.html" class="text-foreground transition-colors">Kajian</a>
                <a href="artikel.html" class="text-muted-foreground hover:text-foreground transition-colors">Artikel</a>
                <a href="tentang.html" class="text-muted-foreground hover:text-foreground transition-colors">Tentang Kami</a>
            </nav>
            <button class="md:hidden p-2 text-foreground" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
        </div>
    </header>

    <main class="flex-grow">
        <!-- Page Header -->
        <section class="bg-muted/30 py-10 border-b border-border">
            <div class="container mx-auto px-4 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight mb-2">Jadwal Kajian</h1>
                    <p class="text-muted-foreground">Informasi jadwal kajian rutin dan tematik di lingkungan PDM Sidoarjo.</p>
                </div>
                <!-- Filter Sederhana (Hanya UI) -->
                <div class="w-full md:w-auto">
                    <select class="w-full md:w-48 h-10 px-3 py-2 rounded-md border border-border bg-white text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="semua">Semua Kategori</option>
                        <option value="rutin">Kajian Rutin</option>
                        <option value="tematik">Kajian Tematik</option>
                        <option value="akbar">Tabligh Akbar</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Daftar Kajian -->
        <section class="py-12">
            <div class="container mx-auto px-4">
                <div id="kajian-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Card kajian dimuat melalui ES6 -->
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-border bg-white py-8 mt-auto">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div class="flex items-center gap-2">
                <img src="https://picsum.photos/seed/logo/32/32" alt="Logo Footer" class="rounded-full w-8 h-8 object-cover grayscale">
                <span class="font-semibold">Majelis Tabligh PDM Sidoarjo</span>
            </div>
            <div class="text-sm text-muted-foreground">
                &copy; 2026 Tablighmu Sidoarjo. Hak Cipta Dilindungi.
            </div>
        </div>
    </footer>

    <!-- Logika ES6+ -->
    <script type="module">
        const jadwalKajian = [
            {
                id: 1,
                title: "Tafsir Al-Qur'an Tematik: Membangun Keluarga Sakinah",
                speaker: "Ust. Dr. H. Hasanuddin, M.Ag.",
                type: "Kajian Rutin",
                date: "Ahad, 30 Agustus 2026",
                time: "05:30 WIB (Ba'da Subuh)",
                location: "Masjid An-Nur, Sidoarjo",
                image: "https://picsum.photos/seed/jadwal1/600/400",
                url: "kajian-detail.html?id=1"
            },
            {
                id: 2,
                title: "Fiqih Muamalah Kontemporer di Era Digital",
                speaker: "Ust. M. Taufiq, Lc., M.HI.",
                type: "Kajian Tematik",
                date: "Rabu, 02 September 2026",
                time: "18:30 WIB (Ba'da Maghrib)",
                location: "Masjid Al-Ikhlas, Candi",
                image: "https://picsum.photos/seed/jadwal2/600/400",
                url: "kajian-detail.html?id=2"
            },
            {
                id: 3,
                title: "Tabligh Akbar: Menyongsong Abad Kedua Muhammadiyah",
                speaker: "Prof. Dr. H. Abdul Mu'ti, M.Ed.",
                type: "Tabligh Akbar",
                date: "Sabtu, 12 September 2026",
                time: "08:00 - 11:30 WIB",
                location: "Auditorium SMA Muhammadiyah 2 Sidoarjo",
                image: "https://picsum.photos/seed/jadwal3/600/400",
                url: "kajian-detail.html?id=3"
            },
            {
                id: 4,
                title: "Kajian Tarjih: Tuntunan Shalat Berjamaah",
                speaker: "Tim Majelis Tarjih PDM Sidoarjo",
                type: "Kajian Rutin",
                date: "Jumat, 04 September 2026",
                time: "19:30 WIB (Ba'da Isya)",
                location: "Masjid Ki Bagus Hadikusumo, Umsida",
                image: "https://picsum.photos/seed/jadwal4/600/400",
                url: "kajian-detail.html?id=4"
            }
        ];

        const renderKajian = () => {
            const container = document.getElementById('kajian-container');
            
            jadwalKajian.forEach(kajian => {
                const card = document.createElement('div');
                card.className = "flex flex-col border border-border bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all duration-200 group relative";
                
                card.innerHTML = `
                    <div class="relative w-full aspect-[21/9] md:aspect-[3/2] overflow-hidden">
                        <img src="${kajian.image}" alt="${kajian.title}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy">
                        <div class="absolute top-3 right-3 bg-primary text-primary-foreground px-2.5 py-1 rounded-md text-xs font-semibold shadow-sm">
                            ${kajian.type}
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="font-bold text-lg mb-1 leading-tight group-hover:text-primary transition-colors">
                            <a href="${kajian.url}" class="before:absolute before:inset-0">${kajian.title}</a>
                        </h3>
                        <p class="text-primary font-medium text-sm mb-4">Bersama: ${kajian.speaker}</p>
                        
                        <div class="space-y-2 mt-auto text-sm text-muted-foreground">
                            <div class="flex items-start gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 shrink-0"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                <span>${kajian.date}</span>
                            </div>
                            <div class="flex items-start gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 shrink-0"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                <span>${kajian.time}</span>
                            </div>
                            <div class="flex items-start gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 shrink-0"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                <span>${kajian.location}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        document.addEventListener("DOMContentLoaded", renderKajian);
    </script>
</body>
</html>
